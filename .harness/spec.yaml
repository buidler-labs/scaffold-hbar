schemaVersion: 2
name: blank-template-extend
description: >
  In-place extension of the blank Scaffold-HBAR starter — add a public Getting Started page explaining how to use the scaffold without rebuilding the app.

skills:
  - project-scaffolding
  - quality-gates

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
  forbiddenWorkspaces:
    - packages/hardhat
    - packages/foundry
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn hardhat:*
    - yarn foundry:*
    - docker *

templateMetadata:
  name: blank
  frontend: nextjs-app
  solidityFramework: foundry
# Baseline = existing project health before the extension is implemented.
# Target acceptance = validators below (Getting Started page + yarn lint/build).
baseline:
  commands:
    - name: install
      command: yarn install
      timeoutMs: 300000
    - name: lint
      command: yarn next:lint
      timeoutMs: 180000
    - name: build
      command: yarn next:build
      timeoutMs: 300000

requiredFiles:
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/nextjs/app/page.tsx
  - packages/nextjs/components/Header.tsx
  - packages/nextjs/app/getting-started/page.tsx

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"
      # Scaffold ships placeholder Alchemy keys in framework env templates.
      allowIn:
        - packages/foundry/.env.example
        - packages/hardhat/.env.example
        - packages/nextjs/.env.example
