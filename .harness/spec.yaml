schemaVersion: 2
name: x402-pay-per-use-extend
description: >
  In-place extension of the x402 pay-per-use marketplace — add a public How x402 Works page explaining FileRegistry, facilitator verify/settle, and HBAR 402 flows without rebuilding the app.

skills:
  - x402-payments
  - quality-gates

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
    - packages/hardhat
  forbiddenWorkspaces:
    - packages/foundry
  # Docker is required by this template (MinIO + facilitator). Do NOT forbid docker *.
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn foundry:*

templateMetadata:
  name: x402-pay-per-use
  frontend: nextjs-app
  solidityFramework: hardhat
# Baseline = existing project health before the extension is implemented.
# Target acceptance = validators below (How it works page + yarn lint/build).
# Live MinIO/facilitator / paid download validation is out of scope for this gate 0–1 recipe.
baseline:
  commands:
    - name: install
      command: yarn install
      timeoutMs: 300000
    - name: lint
      command: yarn lint
      timeoutMs: 180000
    - name: build
      command: yarn next:build
      timeoutMs: 300000

requiredFiles:
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/hardhat/package.json
  - packages/nextjs/app/page.tsx
  - packages/nextjs/components/Header.tsx
  - packages/nextjs/app/how-it-works/page.tsx
  - packages/hardhat/contracts/FileRegistry.sol
  - packages/nextjs/services/x402/server.ts
  - packages/nextjs/services/x402/client.ts
  - packages/nextjs/app/api/files/[id]/download/route.ts
  - docker-compose.yml

forbiddenFiles:
  - packages/foundry

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
    - packages/hardhat/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY|FACILITATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
      allowIn:
        - .env.example
        - packages/nextjs/.env.example
        - packages/hardhat/.env.example
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"
      allowIn:
        - .env.example
        - packages/nextjs/.env.example
        - packages/hardhat/.env.example
