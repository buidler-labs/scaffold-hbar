name: bridge-extend
description: >
  In-place extension of the Scaffold-HBAR bridge template — add a public Bridge Architecture
  page explaining LayerZero OFT + HTS connector flows without rebuilding the app.

# Paths are relative to the project root (parent of .harness/).
prd: .harness/prd.md

# No seed — extend runs against the already-scaffolded cwd.

generator:
  provider: command
  command: agent
  args:
    - -p
    - --trust
    - --sandbox
    - enabled
    - --workspace
    - "{workspace}"
    - --model
    - composer-2.5
    - --force
    - --output-format
    - stream-json
    - --stream-partial-output
  timeoutMs: 3600000

skills:
  - layerzero-messaging
  - quality-gates

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
    - packages/foundry
  forbiddenWorkspaces:
    - packages/hardhat
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn hardhat:*
    - docker *

templateMetadata:
  name: bridge
  frontend: nextjs-app
  solidityFramework: foundry

# Baseline = existing project health before the extension is implemented.
# Target acceptance = validators below (Architecture page + yarn lint/build).
# Full multi-network deploy validation (Sepolia RPC + live LayerZero) is out of scope for this gate 0–1 recipe.
extend:
  baseline:
    commands:
      - name: install
        command: yarn install
        timeoutMs: 300000
      - name: submodules
        command: git submodule update --init --recursive --force
        timeoutMs: 300000
      - name: lint
        # Root `yarn lint` also runs foundry prettier checks that currently fail on stock scripts-js.
        command: yarn next:lint
        timeoutMs: 180000
      - name: compile
        command: yarn foundry:compile
        timeoutMs: 300000
      - name: build
        command: yarn next:build
        timeoutMs: 300000

validators:
  static: .harness/validators/static.json
  commands: .harness/validators/yarn.json

requiredFiles:
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/foundry/package.json
  - packages/nextjs/app/page.tsx
  - packages/nextjs/components/Header.tsx
  - packages/nextjs/app/architecture/page.tsx
  - packages/foundry/contracts/layerzero/MyOFT.sol
  - packages/foundry/contracts/layerzero/hts/HTSConnector.sol
  - packages/foundry/contracts/layerzero/hts/MyHTSConnectorOFT.sol
  - packages/foundry/script/layerzero/WireOApp.s.sol
  - .harness/spec.yaml
  - .harness/prd.md

forbiddenFiles:
  - .env
  - packages/nextjs/.env
  - packages/hardhat

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
    - packages/foundry/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY|LAYERZERO_RELAY_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
      allowIn:
        # Upstream CCIP docs include example Anvil keys in README snippets.
        - packages/foundry/lib/ccip/integration-tests/README_SETH.md
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"
      allowIn:
        - packages/foundry/.env.example
        - packages/nextjs/.env.example
        - packages/foundry/lib/ccip/integration-tests/README_SETH.md
        # Upstream ITS test constants use INTERCHAIN_TOKEN = 'deploy…' identifiers.
        - packages/foundry/lib/interchain-token-service/test/constants.js

maxAttempts: 3

logging:
  jsonl: .harness/runs/harness.log.jsonl
  notes: .harness/runs/harness-notes.md
