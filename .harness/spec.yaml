schemaVersion: 2
name: cross-chain-dca-extend
description: >
  In-place extension of the cross-chain DCA app — add a public Cross-Chain Flow page explaining Hedera → Axelar GMP → Sepolia orchestration without rebuilding the app.

skills:
  - axelar-gmp
  - hss-system-contract
  - quality-gates

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
    - packages/hardhat
  forbiddenWorkspaces:
    - packages/foundry
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn foundry:*
    - docker *

templateMetadata:
  name: cross-chain-dca
  frontend: nextjs-app
  solidityFramework: hardhat
# Baseline = existing project health before the extension is implemented.
# Target acceptance = validators below (Flow page + yarn lint/build).
# Full multi-network deploy validation (Sepolia RPC + live Axelar) is out of scope for this gate 0–1 recipe.
baseline:
  commands:
    - name: install
      command: yarn install
      timeoutMs: 300000
    - name: lint
      command: yarn lint
      timeoutMs: 180000
    - name: build
      command: yarn next:build
      timeoutMs: 300000

requiredFiles:
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/hardhat/package.json
  - packages/nextjs/app/page.tsx
  - packages/nextjs/app/dca/page.tsx
  - packages/nextjs/components/Header.tsx
  - packages/nextjs/app/flow/page.tsx
  - packages/hardhat/contracts/hedera/DcaOrchestrator.sol
  - packages/hardhat/contracts/hedera/AxelarMessageSender.sol
  - packages/hardhat/contracts/sepolia/AxelarMessageReceiver.sol
  - packages/hardhat/contracts/sepolia/DcaExecutor.sol

forbiddenFiles:
  - .env
  - packages/nextjs/.env
  - packages/foundry

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
    - packages/hardhat/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"
      allowIn:
        - packages/hardhat/.env.example
        - packages/nextjs/.env.example
        # Test fixtures use TARGET_TOKEN = "0x…" which matches the TOKEN= pattern.
        - packages/hardhat/test/hedera/AxelarMessageSender.ts
        - packages/hardhat/test/hedera/DcaOrchestrator.ts
