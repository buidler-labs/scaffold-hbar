schemaVersion: 2
name: tokenise-subscriptions-extend
description: >
  In-place extension of the NFT subscription marketplace — add a public Subscription Guide page explaining HTS rental and sales flows without rebuilding the app.

skills:
  - hedera-token-service
  - hts-system-contract
  - quality-gates

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
    - packages/hardhat
  forbiddenWorkspaces:
    - packages/foundry
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn foundry:*
    - docker *

templateMetadata:
  name: tokenise-subscriptions
  frontend: nextjs-app
  solidityFramework: hardhat
# Baseline = existing project health before the extension is implemented.
# Target acceptance = validators below (Guide page + yarn lint/build).
baseline:
  commands:
    - name: install
      command: yarn install
      timeoutMs: 300000
    - name: lint
      command: yarn lint
      timeoutMs: 180000
    - name: build
      command: yarn next:build
      timeoutMs: 300000

requiredFiles:
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/hardhat/package.json
  - packages/nextjs/app/page.tsx
  - packages/nextjs/components/Header.tsx
  - packages/nextjs/app/guide/page.tsx
  - packages/hardhat/contracts/SubscriptionNFT.sol
  - packages/hardhat/contracts/interfaces/IHederaTokenService.sol

forbiddenFiles:
  - .env
  - packages/nextjs/.env
  - packages/foundry

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"
      allowIn:
        - packages/hardhat/.env.example
        - packages/nextjs/.env.example
